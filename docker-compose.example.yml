services:
  traefik-cert-exporter:
    image: ghcr.io/freender/traefik-cert-exporter:main
    container_name: traefik-cert-exporter
    init: true
    restart: always
    user: 1000:1000
    environment:
      DOMAIN: example.net
      REDIS_SENTINEL_ADDRS: sentinel-a:26379,sentinel-b:26379,sentinel-c:26379
      REDIS_SENTINEL_MASTER: traefik
      REDIS_PASS: ${REDIS_PASS}
    volumes:
      - ./acme.json:/acme/acme.json:ro
